:root{--o:#EA561F;--ink:#2A1810;--cream:#FFF6E6}
*{box-sizing:border-box;margin:0}
body{font-family:'Gill Sans','Gill Sans MT','Cabin',Calibri,sans-serif;background:var(--cream);color:var(--ink)}
.bar{display:flex;gap:8px;align-items:center;padding:14px 24px;position:sticky;top:0;background:#fff;z-index:5;border-bottom:1px solid #eadfcf;flex-wrap:wrap}

.bg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.txt,.pic{position:relative;z-index:1}

.txt p{color:var(--ht,#fff);font-size:24px;margin:22px 0 32px}
.btn{display:inline-flex;gap:4px}.btn span{background:var(--bb,#FFF6E6);color:var(--bt,#2A1810);padding:14px 22px;border-radius:10px;font-weight:700}
.pic img{width:100%;border-radius:12px;border:6px solid var(--cream);transform:rotate(-2deg);box-shadow:0 20px 40px rgba(0,0,0,.18);display:block}
.note{max-width:900px;margin:28px auto;padding:0 24px;font-size:17px;line-height:1.5}
